[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-wavepacket-sim"
version = "1.0.0"
description = "GPU-accelerated numerical solver for the Time-Dependent Schrödinger Equation using spectral and finite-difference methods"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "annashahed09-sudo"},
]
keywords = ["quantum", "simulation", "tdse", "schrodinger", "wavepacket", "physics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Simulation",
]

dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "pydantic",
    "pydantic-settings",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "bcrypt<5",
    "python-multipart",
    "psutil",
    "email-validator",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "httpx",
    "ruff>=0.1",
    "pre-commit>=3",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["core*", "solvers*", "quantum_platform*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[project.urls]
Source = "https://github.com/annashahed09-sudo/quantum-wavepacket-sim"
